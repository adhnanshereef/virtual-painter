<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hand Gesture Drawing App</title>
    <!-- Updated MediaPipe imports -->
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/camera_utils/camera_utils.js" crossorigin="anonymous"></script>
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/control_utils/control_utils.js" crossorigin="anonymous"></script>
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/drawing_utils/drawing_utils.js" crossorigin="anonymous"></script>
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/hands/hands.js" crossorigin="anonymous"></script>
    <style>
        :root {
            --dark-bg: #212121;
            --panel-bg: #333333;
            --accent-color: #800080;
            --button-bg: #555555;
            --button-hover: #666666;
            --button-active: #777777;
            --ad-bg: #1a1a1a;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Arial', sans-serif;
        }

        body {
            background-color: var(--dark-bg);
            color: white;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }

        .main-container {
            display: flex;
            flex: 1;
            overflow: hidden;
        }

        .camera-container {
            position: relative;
            flex: 1;
            display: flex;
            justify-content: center;
            align-items: center;
            background-color: black;
            overflow: hidden;
        }

        #output-canvas {
            position: absolute;
            top: 0;
            left: 0;
            z-index: 1;
        }

        #video {
            width: 100%;
            height: 100%;
            object-fit: contain;
            display: none;
        }

        .ad-panel {
            width: 300px;
            background-color: var(--ad-bg);
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 20px;
        }

        .ad-title {
            font-size: 24px;
            font-weight: bold;
            color: var(--accent-color);
            margin-top: 50px;
            margin-bottom: 10px;
        }

        .ad-tagline {
            font-size: 14px;
            margin-bottom: 20px;
            text-align: center;
        }

        .ad-link {
            color: white;
            text-decoration: underline;
            cursor: pointer;
            margin-bottom: 30px;
        }

        .qr-code {
            width: 200px;
            height: 200px;
            background-color: #333;
            display: flex;
            justify-content: center;
            align-items: center;
            margin-bottom: 30px;
        }

        .qr-code img {
            width: 100%;
            height: 100%;
            object-fit: contain;
        }

        .learn-more-btn {
            background-color: #4CAF50;
            color: white;
            border: none;
            padding: 10px 20px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            border-radius: 4px;
        }

        .learn-more-btn:hover {
            background-color: #45a049;
        }

        .control-panel {
            background-color: var(--panel-bg);
            padding: 10px;
            display: flex;
            flex-wrap: wrap;
            align-items: stretch;
            min-height: 150px;
        }

        .control-section {
            margin: 0 10px;
            padding: 10px;
            border: 1px solid #444;
            border-radius: 5px;
            flex: 1;
            min-width: 150px;
            display: flex;
            flex-direction: column;
        }

        .section-title {
            font-size: 16px;
            margin-bottom: 10px;
            text-align: center;
        }

        .radio-group {
            display: flex;
            flex-direction: column;
            gap: 5px;
        }

        .radio-item {
            display: flex;
            align-items: center;
            gap: 5px;
        }

        .tools-container {
            display: flex;
            flex-direction: column;
            gap: 10px;
            justify-content: center;
            align-items: center;
        }

        .button {
            background-color: var(--button-bg);
            color: white;
            border: none;
            padding: 8px 15px;
            cursor: pointer;
            border-radius: 4px;
            font-size: 14px;
        }

        .button:hover {
            background-color: var(--button-hover);
        }

        .button:active {
            background-color: var(--button-active);
        }

        .color-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 5px;
            margin-bottom: 10px;
        }

        .color-button {
            width: 30px;
            height: 30px;
            border: 2px solid white;
            border-radius: 50%;
            cursor: pointer;
        }

        .color-button.active {
            border-color: yellow;
            box-shadow: 0 0 0 2px yellow;
        }

        .slider-container {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 5px;
        }

        .slider-label {
            font-size: 14px;
        }

        .slider {
            width: 100%;
            background-color: var(--dark-bg);
        }

        .status-display {
            background-color: var(--dark-bg);
            padding: 10px;
            border-radius: 5px;
            font-size: 16px;
            text-align: center;
            flex: 1;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .guide-list {
            list-style-type: none;
        }

        .guide-item {
            padding: 5px 0;
        }

        @media (max-width: 1200px) {
            .control-panel {
                flex-direction: column;
                align-items: stretch;
            }
            
            .control-section {
                margin: 5px 0;
            }
            
            .main-container {
                flex-direction: column;
            }
            
            .ad-panel {
                width: 100%;
                height: 150px;
                flex-direction: row;
                justify-content: space-around;
                padding: 10px;
            }
            
            .ad-title {
                margin-top: 0;
            }
            
            .qr-code {
                width: 100px;
                height: 100px;
                margin-bottom: 0;
            }
        }
    </style>
</head>
<body>
    <div class="main-container">
        <div class="camera-container">
            <video id="video" autoplay playsinline></video>
            <canvas id="output-canvas"></canvas>
        </div>
        <div class="ad-panel">
            <div class="ad-title">Day App</div>
            <div class="ad-tagline">Organize your World with Day</div>
            <div class="ad-link">day.adhnan.tech</div>
            <div class="qr-code">
                <img src="day-qr.png" alt="QR Code">
            </div>
            <button class="learn-more-btn">Learn More</button>
        </div>
    </div>
    
    <div class="control-panel">
        <div class="control-section">
            <div class="section-title">Drawing Mode</div>
            <div class="radio-group">
                <label class="radio-item">
                    <input type="radio" name="drawMode" value="pinch" checked>
                    <span>Pinch to Draw</span>
                </label>
                <label class="radio-item">
                    <input type="radio" name="drawMode" value="pointing">
                    <span>Pointing Finger to Draw</span>
                </label>
            </div>
        </div>
        
        <div class="control-section">
            <div class="section-title">Tools</div>
            <div class="tools-container">
                <button id="clear-canvas" class="button">Clear Canvas</button>
                <div class="slider-container">
                    <span class="slider-label">Thickness:</span>
                    <input type="range" min="1" max="20" value="5" class="slider" id="thickness-slider">
                </div>
            </div>
        </div>
        
        <div class="control-section">
            <div class="section-title">Colors</div>
            <div class="color-grid">
                <div class="color-button active" style="background-color: #FF0000;" data-color="255,0,0" data-name="Red"></div>
                <div class="color-button" style="background-color: #00FF00;" data-color="0,255,0" data-name="Green"></div>
                <div class="color-button" style="background-color: #0000FF;" data-color="0,0,255" data-name="Blue"></div>
                <div class="color-button" style="background-color: #FFFF00;" data-color="255,255,0" data-name="Yellow"></div>
                <div class="color-button" style="background-color: #FF00FF;" data-color="255,0,255" data-name="Purple"></div>
                <div class="color-button" style="background-color: #FFFFFF;" data-color="255,255,255" data-name="White"></div>
            </div>
            <button id="custom-color" class="button">Custom Color</button>
        </div>
        
        <div class="control-section">
            <div class="section-title">Status</div>
            <div id="status" class="status-display">Ready</div>
        </div>
        
        <div class="control-section">
            <div class="section-title">Gesture Guide</div>
            <ul class="guide-list">
                <li class="guide-item">✋ Open Hand: Erase</li>
                <li class="guide-item">👆 Pointing: Draw (if mode selected)</li>
                <li class="guide-item">👌 Pinch: Draw (if mode selected)</li>
                <li class="guide-item">✌️ Two Fingers: Select</li>
            </ul>
        </div>
    </div>

    <script>
        document.addEventListener('DOMContentLoaded', () => {
            // DOM elements
            const video = document.getElementById('video');
            const outputCanvas = document.getElementById('output-canvas');
            const ctx = outputCanvas.getContext('2d');
            const statusDisplay = document.getElementById('status');
            const thicknessSlider = document.getElementById('thickness-slider');
            const clearButton = document.getElementById('clear-canvas');
            const customColorButton = document.getElementById('custom-color');
            const colorButtons = document.querySelectorAll('.color-button');
            const drawModeRadios = document.querySelectorAll('input[name="drawMode"]');
            
            // App state
            let drawMode = 'pointing';
            let drawingColor = { r: 255, g: 0, b: 0, name: 'Red' };
            let thickness = 5;
            let isDrawing = false;
            let prevX = 0;
            let prevY = 0;
            let drawingLayer = null;
            
            // Initialize camera
            const initCamera = async () => {
                try {
                    // Make video element visible for debugging
                    video.style.display = 'block';
                    video.style.position = 'absolute';
                    video.style.opacity = '0.7';
                    video.style.transform = 'none';
                    
                    const constraints = {
                        video: {
                            width: { ideal: 1280 },
                            height: { ideal: 720 },
                            facingMode: "user"
                        }
                    };
                    
                    const stream = await navigator.mediaDevices.getUserMedia(constraints);
                    video.srcObject = stream;
                    
                    // Display status
                    updateStatus('Camera initialized. Starting hand tracking...');
                    
                    // Wait for video to be loaded
                    return new Promise((resolve) => {
                        video.onloadedmetadata = () => {
                            // Set canvas dimensions to match video
                            outputCanvas.width = video.videoWidth;
                            outputCanvas.height = video.videoHeight;
                            
                            // Initialize drawing layer
                            drawingLayer = new ImageData(
                                new Uint8ClampedArray(video.videoWidth * video.videoHeight * 4), 
                                video.videoWidth, 
                                video.videoHeight
                            );
                            
                            // Fill with transparent pixels
                            for (let i = 0; i < drawingLayer.data.length; i += 4) {
                                drawingLayer.data[i + 3] = 0; // Alpha channel
                            }
                            
                            resolve();
                        };
                    });
                } catch (error) {
                    console.error('Error accessing camera:', error);
                    updateStatus('Error: Cannot access camera. Check permissions.');
                    alert('Camera access denied. Please allow camera permissions and refresh the page.');
                }
            };
            
            // MediaPipe Hands setup with proper error handling
            const setupMediaPipe = async () => {
                try {
                    const hands = new Hands({
                        locateFile: (file) => {
                            return `https://cdn.jsdelivr.net/npm/@mediapipe/hands/${file}`;
                        }
                    });
                    
                    hands.setOptions({
                        maxNumHands: 1,
                        modelComplexity: 1,
                        minDetectionConfidence: 0.7,
                        minTrackingConfidence: 0.7
                    });
                    
                    hands.onResults(handleResults);
                    
                    // Create a camera object
                    const camera = new Camera(video, {
                        onFrame: async () => {
                            await hands.send({image: video});
                        },
                        width: 1280,
                        height: 720,
                        mirrored: false
                    });
                    
                    // Start camera
                    camera.start();
                    updateStatus('Hand tracking started. Ready to draw!');
                    
                } catch (error) {
                    console.error('Error setting up MediaPipe Hands:', error);
                    updateStatus('Error: Could not initialize hand tracking');
                }
            };
            
            // Initialize app
            const initApp = async () => {
                await initCamera();
                await setupMediaPipe();
            };
            
            // Handle hand detection results
            function handleResults(results) {
                // Clear canvas
                ctx.clearRect(0, 0, outputCanvas.width, outputCanvas.height);
                
                // Draw video frame
                ctx.drawImage(video, 0, 0, outputCanvas.width, outputCanvas.height);
                
                // Draw the drawing layer
                ctx.putImageData(drawingLayer, 0, 0);
                
                if (results.multiHandLandmarks && results.multiHandLandmarks.length > 0) {
                    const landmarks = results.multiHandLandmarks[0];
                    
                    // Adjust landmarks to remove mirror effect
                    const unmirroredLandmarks = landmarks.map(lm => ({
                        x: 1 - lm.x,
                        y: lm.y,
                        z: lm.z
                    }));
                    
                    // Draw hand landmarks
                    drawConnectors(ctx, unmirroredLandmarks, HAND_CONNECTIONS, { color: '#00FF00', lineWidth: 2 });
                    drawLandmarks(ctx, unmirroredLandmarks, { color: '#FF0000', lineWidth: 1 });
                    
                    // Detect gesture
                    const gesture = detectGesture(unmirroredLandmarks);
                    updateStatus(`Gesture: ${gesture.name}`);
                    
                    // Handle gesture
                    handleGesture(gesture);
                } else {
                    // No hands detected
                    isDrawing = false;
                    prevX = 0;
                    prevY = 0;
                }
            }
            
            // Detect hand gesture
            function detectGesture(landmarks) {
                // Extract landmark coordinates
                const points = landmarks.map(lm => ({
                    x: Math.floor(lm.x * outputCanvas.width),
                    y: Math.floor(lm.y * outputCanvas.height)
                }));
                
                // Check if fingers are extended
                const thumbTip = points[4];
                const indexTip = points[8];
                const indexPip = points[6];
                const middleTip = points[12];
                const middlePip = points[10];
                const ringTip = points[16];
                const ringPip = points[14];
                const pinkyTip = points[20];
                const pinkyPip = points[18];
                
                const indexExtended = indexTip.y < indexPip.y;
                const middleExtended = middleTip.y < middlePip.y;
                const ringExtended = ringTip.y < ringPip.y;
                const pinkyExtended = pinkyTip.y < pinkyPip.y;
                
                // Distance between thumb and index finger for pinch detection
                const pinchDistance = Math.sqrt(
                    Math.pow(thumbTip.x - indexTip.x, 2) + 
                    Math.pow(thumbTip.y - indexTip.y, 2)
                );
                const isPinching = pinchDistance < 40;
                
                // Detect gestures
                if (indexExtended && !middleExtended && !ringExtended && !pinkyExtended) {
                    return { name: 'pointing', point: indexTip };
                } else if (isPinching) {
                    return { name: 'pinch', point: indexTip };
                } else if (indexExtended && middleExtended && !ringExtended && !pinkyExtended) {
                    return { name: 'select', point: indexTip };
                } else if (indexExtended && middleExtended && ringExtended && pinkyExtended) {
                    // Calculate palm center
                    const palmX = Math.floor(points.reduce((sum, p) => sum + p.x, 0) / points.length);
                    const palmY = Math.floor(points.reduce((sum, p) => sum + p.y, 0) / points.length);
                    return { name: 'open_hand', point: { x: palmX, y: palmY } };
                } else {
                    return { name: 'none', point: null };
                }
            }
            
            // Handle detected gesture
            function handleGesture(gesture) {
                if (gesture.name === 'open_hand' && gesture.point) {
                    // Erase mode
                    isDrawing = false;
                    updateStatus('Erasing with open hand');
                    
                    // Draw eraser circle for visualization
                    const eraserRadius = thickness * 3;
                    ctx.beginPath();
                    ctx.arc(gesture.point.x, gesture.point.y, eraserRadius, 0, Math.PI * 2);
                    ctx.strokeStyle = 'yellow';
                    ctx.lineWidth = 2;
                    ctx.stroke();
                    
                    // Erase on drawing layer
                    eraseCircle(gesture.point.x, gesture.point.y, eraserRadius);
                } else if (gesture.name === 'pinch' && drawMode === 'pinch' && gesture.point) {
                    // Draw with pinch gesture
                    if (prevX > 0 && prevY > 0) {
                        drawLine(prevX, prevY, gesture.point.x, gesture.point.y);
                    }
                    prevX = gesture.point.x;
                    prevY = gesture.point.y;
                    isDrawing = true;
                    updateStatus(`Drawing with pinch - Color: ${drawingColor.name}`);
                } else if (gesture.name === 'pointing' && drawMode === 'pointing' && gesture.point) {
                    // Draw with pointing finger
                    if (prevX > 0 && prevY > 0) {
                        drawLine(prevX, prevY, gesture.point.x, gesture.point.y);
                    }
                    prevX = gesture.point.x;
                    prevY = gesture.point.y;
                    isDrawing = true;
                    updateStatus(`Drawing with pointing finger - Color: ${drawingColor.name}`);
                } else if (gesture.name === 'pinch' && drawMode === 'pointing') {
                    updateStatus("Pinch detected (switch to pinch mode to draw)");
                    isDrawing = false;
                } else if (gesture.name === 'pointing' && drawMode === 'pinch') {
                    updateStatus("Pointing finger detected (switch to pointing mode to draw)");
                    isDrawing = false;
                } else if (gesture.name === 'select' && gesture.point) {
                    // Selection mode
                    isDrawing = false;
                    updateStatus("Selection mode - Two fingers detected");
                    
                    // Draw selection indicator
                    ctx.beginPath();
                    ctx.arc(gesture.point.x, gesture.point.y, 15, 0, Math.PI * 2);
                    ctx.strokeStyle = 'yellow';
                    ctx.lineWidth = 2;
                    ctx.stroke();
                    
                    ctx.beginPath();
                    ctx.moveTo(gesture.point.x - 20, gesture.point.y);
                    ctx.lineTo(gesture.point.x + 20, gesture.point.y);
                    ctx.moveTo(gesture.point.x, gesture.point.y - 20);
                    ctx.lineTo(gesture.point.x, gesture.point.y + 20);
                    ctx.strokeStyle = 'yellow';
                    ctx.lineWidth = 2;
                    ctx.stroke();
                } else {
                    // No recognized gesture or not in the right mode
                    isDrawing = false;
                    prevX = 0;
                    prevY = 0;
                }
            }
            
            // Draw line on the drawing layer
            function drawLine(x1, y1, x2, y2) {
                const imageData = drawingLayer;
                const { r, g, b } = drawingColor;
                
                // Simple line drawing algorithm (Bresenham's algorithm)
                const dx = Math.abs(x2 - x1);
                const dy = Math.abs(y2 - y1);
                const sx = (x1 < x2) ? 1 : -1;
                const sy = (y1 < y2) ? 1 : -1;
                let err = dx - dy;
                
                while (true) {
                    // Draw a circle at the current point
                    drawCircle(x1, y1, thickness, r, g, b);
                    
                    if (x1 === x2 && y1 === y2) break;
                    const e2 = 2 * err;
                    if (e2 > -dy) {
                        err -= dy;
                        x1 += sx;
                    }
                    if (e2 < dx) {
                        err += dx;
                        y1 += sy;
                    }
                }
            }
            
            // Draw circle on the drawing layer
            function drawCircle(centerX, centerY, radius, r, g, b) {
                const imageData = drawingLayer;
                const width = imageData.width;
                const height = imageData.height;
                
                // Bounds checking
                const minX = Math.max(0, centerX - radius);
                const minY = Math.max(0, centerY - radius);
                const maxX = Math.min(width - 1, centerX + radius);
                const maxY = Math.min(height - 1, centerY + radius);
                
                for (let y = minY; y <= maxY; y++) {
                    for (let x = minX; x <= maxX; x++) {
                        const dx = x - centerX;
                        const dy = y - centerY;
                        const distance = Math.sqrt(dx * dx + dy * dy);
                        
                        if (distance <= radius) {
                            const index = (y * width + x) * 4;
                            imageData.data[index] = r;     // R
                            imageData.data[index + 1] = g; // G
                            imageData.data[index + 2] = b; // B
                            imageData.data[index + 3] = 255; // A
                        }
                    }
                }
            }
            
            // Erase circle on the drawing layer
            function eraseCircle(centerX, centerY, radius) {
                const imageData = drawingLayer;
                const width = imageData.width;
                const height = imageData.height;
                
                // Bounds checking
                const minX = Math.max(0, centerX - radius);
                const minY = Math.max(0, centerY - radius);
                const maxX = Math.min(width - 1, centerX + radius);
                const maxY = Math.min(height - 1, centerY + radius);
                
                for (let y = minY; y <= maxY; y++) {
                    for (let x = minX; x <= maxX; x++) {
                        const dx = x - centerX;
                        const dy = y - centerY;
                        const distance = Math.sqrt(dx * dx + dy * dy);
                        
                        if (distance <= radius) {
                            const index = (y * width + x) * 4;
                            imageData.data[index + 3] = 0; // Set alpha to 0 (transparent)
                        }
                    }
                }
            }
            
            // Clear canvas
            function clearCanvas() {
                if (drawingLayer) {
                    // Set all pixels to transparent
                    for (let i = 0; i < drawingLayer.data.length; i += 4) {
                        drawingLayer.data[i + 3] = 0; // Alpha channel
                    }
                    updateStatus('Canvas cleared');
                }
            }
            
            // Update status display
            function updateStatus(message) {
                statusDisplay.textContent = message;
            }
            
            // Set up event listeners
            clearButton.addEventListener('click', clearCanvas);
            
            thicknessSlider.addEventListener('input', () => {
                thickness = parseInt(thicknessSlider.value);
            });
            
            colorButtons.forEach(button => {
                button.addEventListener('click', () => {
                    // Update active button
                    colorButtons.forEach(btn => btn.classList.remove('active'));
                    button.classList.add('active');
                    
                    // Set color
                    const colorValues = button.dataset.color.split(',');
                    drawingColor = {
                        r: parseInt(colorValues[0]),
                        g: parseInt(colorValues[1]),
                        b: parseInt(colorValues[2]),
                        name: button.dataset.name
                    };
                    
                    updateStatus(`Color set to ${drawingColor.name}`);
                });
            });
            
            customColorButton.addEventListener('click', () => {
                const colorPicker = document.createElement('input');
                colorPicker.type = 'color';
                colorPicker.click();
                
                colorPicker.addEventListener('input', () => {
                    const hex = colorPicker.value;
                    
                    // Convert hex to RGB
                    const r = parseInt(hex.slice(1, 3), 16);
                    const g = parseInt(hex.slice(3, 5), 16);
                    const b = parseInt(hex.slice(5, 7), 16);
                    
                    drawingColor = { r, g, b, name: hex };
                    
                    // Remove active class from all buttons
                    colorButtons.forEach(btn => btn.classList.remove('active'));
                    
                    updateStatus(`Color set to ${hex}`);
                });
            });
            
            drawModeRadios.forEach(radio => {
                radio.addEventListener('change', () => {
                    drawMode = radio.value;
                    updateStatus(`Drawing mode: ${drawMode}`);
                });
            });
            
            // Initialize camera
            initCamera();
            
            // Helper function to draw landmarks (simplified version)
            function drawLandmarks(ctx, landmarks, options = {}) {
                if (!landmarks) return;
                
                const radius = options.lineWidth || 1;
                ctx.fillStyle = options.color || 'red';
                
                for (const landmark of landmarks) {
                    const x = landmark.x * ctx.canvas.width;
                    const y = landmark.y * ctx.canvas.height;
                    
                    ctx.beginPath();
                    ctx.arc(x, y, radius, 0, 2 * Math.PI);
                    ctx.fill();
                }
            }
            
            // Helper function to draw connectors between landmarks
            function drawConnectors(ctx, landmarks, connections, options = {}) {
                if (!landmarks || !connections) return;
                
                ctx.strokeStyle = options.color || 'white';
                ctx.lineWidth = options.lineWidth || 1;
                
                for (const connection of connections) {
                    const [i, j] = connection;
                    const start = landmarks[i];
                    const end = landmarks[j];
                    
                    if (start && end) {
                        ctx.beginPath();
                        ctx.moveTo(start.x * ctx.canvas.width, start.y * ctx.canvas.height);
                        ctx.lineTo(end.x * ctx.canvas.width, end.y * ctx.canvas.height);
                        ctx.stroke();
                    }
                }
            }
            
            // MediaPipe hand connections - define it explicitly
            const HAND_CONNECTIONS = [
                [0, 1], [1, 2], [2, 3], [3, 4],  // Thumb
